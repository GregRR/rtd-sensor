[project]
site_name = "Learn rtd-sensor"
site_url = "https://gregrr.github.io/rtd-sensor/"
site_description = "Beginner-friendly RTD sensor experiments with Python, from Pt100 basics and plotting through real measurements, calibration, uncertainty, and embedded use."
site_author = "Greg Roe"
docs_dir = "learn"
site_dir = "site"
repo_url = "https://github.com/GregRR/rtd-sensor"
repo_name = "GregRR/rtd-sensor"
edit_uri = "edit/main/learn/"
copyright = "Copyright &copy; 2026 Greg Roe"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Start here" = "start-here.md" },
  { "Experiments" = [
    { "1. Your first Pt100 experiment" = "experiments/first-pt100-experiment.md" },
  ] },
  { "Engineering docs" = "https://github.com/GregRR/rtd-sensor/tree/main/docs" },
]

[project.theme]
features = [
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.path",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.zensical.extensions.glightbox]
auto = true

[project.validation]
invalid_links = true
invalid_link_anchors = true
