name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Install project and development dependencies
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"

      - name: Verify project interpreter
        run: |
          uv run --locked python - <<'PY'
          import os
          import sys

          expected = tuple(int(part) for part in os.environ["UV_PYTHON"].split("."))
          if sys.version_info[:2] != expected:
              raise SystemExit(
                  f"Expected Python {expected[0]}.{expected[1]}, "
                  f"got {sys.version_info.major}.{sys.version_info.minor}"
              )
          PY

      - name: Run tests
        run: uv run --locked pytest

      - name: Run Ruff lint
        run: uv run --locked ruff check .

      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .

      - name: Run mypy
        run: uv run --locked mypy

      - name: Check generated conformance artifacts
        run: uv run --locked python -m rtd_sensor._conformance_artifacts --check

      - name: Check conformance release integrity
        run: uv run --locked python -m rtd_sensor._conformance_release --check

      - name: Check tracked files for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Confirm checks did not modify the tree
        run: test -z "$(git status --short)"
