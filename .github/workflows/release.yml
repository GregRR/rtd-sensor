name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --locked --dev

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          uv run --locked python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]

          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match project version "
                  f"{version!r}; expected {expected_tag!r}."
              )
          PY

      - name: Run tests
        run: uv run --locked pytest

      - name: Run Ruff lint
        run: uv run --locked ruff check .

      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .

      - name: Run mypy
        run: uv run --locked mypy

      - name: Check generated conformance artifacts
        run: uv run --locked python -m rtd_sensor._conformance_artifacts --check

      - name: Check conformance release integrity
        run: uv run --locked python -m rtd_sensor._conformance_release --check

      - name: Check tracked files for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Confirm checks did not modify the tree
        run: test -z "$(git status --short)"

      - name: Build distributions without uv source overrides
        run: uv build --no-sources

      - name: Smoke-test built distributions in clean environments
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

          index=0
          for artifact in dist/*.whl dist/*.tar.gz; do
            env_dir=".release-smoke-${index}"
            uv venv --python 3.14 "${env_dir}"
            uv pip install --python "${env_dir}/bin/python" "${artifact}"
            "${env_dir}/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util
          import os

          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          actual_version = importlib.metadata.version("rtd-sensor")
          if actual_version != expected_version:
              raise SystemExit(
                  f"installed version {actual_version!r} does not match "
                  f"release version {expected_version!r}"
              )

          import rtd_sensor
          from rtd_sensor import batch, catalog, fitting, portable, pt100

          if importlib.util.find_spec("rtd") is not None:
              raise SystemExit("legacy rtd import package is unexpectedly present")

          if abs(pt100.resistance_to_celsius(100.0)) > 1e-12:
              raise SystemExit("installed Pt100 smoke conversion failed")

          if batch.celsius_to_resistance(pt100, [0.0]) != [100.0]:
              raise SystemExit("installed batch conversion smoke check failed")

          observations = (
              fitting.CalibrationObservation(0.0, 100.0),
              fitting.CalibrationObservation(50.0, 120.0),
              fitting.CalibrationObservation(100.0, 140.0),
          )
          fit = fitting.fit_polynomial(observations, degree=1)
          artifact = portable.model_to_portable_definition(fit.model)
          loaded = portable.model_from_portable_definition(artifact)
          if abs(loaded.model.celsius_to_resistance(50.0) - 120.0) > 1e-9:
              raise SystemExit("installed fitting/portable smoke check failed")

          if "pt100" not in catalog.supported_models():
              raise SystemExit("installed catalog smoke check failed")

          if rtd_sensor.catalog is not catalog:
              raise SystemExit("installed public package export smoke check failed")
          PY
            rm -rf "${env_dir}"
            index=$((index + 1))
          done

      - name: Upload distributions for publishing
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rtd-sensor
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
