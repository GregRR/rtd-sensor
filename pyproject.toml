[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtd-sensor"
version = "0.4.0"
description = "Python RTD resistance/temperature conversion and modeling for IEC 60751 platinum and nickel RTDs, with tolerance and uncertainty tools."
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
{ name = "Greg Roe" },
]
keywords = [
"pt100",
"pt500",
"pt1000",
"ni1000",
"ni120",
"tk5000",
"nickel-rtd",
"din-43760",
"rtd",
"platinum-rtd",
"iec-60751",
"temperature",
"sensor",
"callendar-van-dusen",
"metrology",
"tolerance",
"uncertainty",
]
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Developers",
"Intended Audience :: Science/Research",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.14",
"Topic :: Scientific/Engineering",
]

dependencies = []

[dependency-groups]
dev = [
"jsonschema>=4.26,<5",
"types-jsonschema>=4.26,<5",
"mypy",
"pytest",
"ruff",
]

[project.urls]
Homepage = "https://github.com/GregRR/rtd-sensor"
Repository = "https://github.com/GregRR/rtd-sensor"
Documentation = "https://github.com/GregRR/rtd-sensor/tree/main/docs"
Changelog = "https://github.com/GregRR/rtd-sensor/blob/main/CHANGELOG.md"
Issues = "https://github.com/GregRR/rtd-sensor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rtd_sensor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
"B",
"E",
"F",
"I",
"SIM",
"UP",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
"src",
"tests",
]
